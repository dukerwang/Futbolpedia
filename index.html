<!DOCTYPE html>
<html lang="en">
  <head>
<script>
  // Fixes broken "Cannot GET" pages by redirecting to the working Hash route
  if (window.location.pathname.includes('/player/')) {
    const id = window.location.pathname.split('/').pop();
    window.location.replace('/#/player/' + id);
  }
</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- share-meta:start (the server replaces this block on /p/ and /c/ pages: services/shareMeta.ts) -->
    <title>Futbolpedia</title>
    <meta name="description" content="Your AI football analyst: a scouting report on any player from any era, and a real opinion on anything you ask.">
    <link rel="canonical" href="https://futbolpedia.org/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://futbolpedia.org/">
    <meta property="og:title" content="Futbolpedia">
    <meta property="og:description" content="Your AI football analyst: a scouting report on any player from any era, and a real opinion on anything you ask.">
    <meta property="og:image" content="https://futbolpedia.org/og/default.png?v=2">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Futbolpedia">
    <meta name="twitter:card" content="summary_large_image">
    <!-- share-meta:end -->

    <script>
      // Theme before first paint, so a dark-mode visitor never sees a cream flash.
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <meta name="theme-color" content="#F5F2E9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1A1F2E" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <!-- Deferred: it runs after parsing and before the app's module script, which reads window.supabase. -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:opsz,wght@6..72,700&display=swap" rel="stylesheet">
    <!-- Only the icons the source uses (vite.config.ts fills this in from scripts/iconNames.ts). -->
    <link href="%ICON_FONT_HREF%" rel="stylesheet">
</head>
  <body class="bg-cream-200 dark:bg-charcoal text-charcoal dark:text-cream-100 font-sans antialiased h-[100dvh] flex flex-col overflow-hidden selection:bg-charcoal selection:text-cream-50 dark:selection:bg-emerald-500">
    <div id="root" class="h-full flex flex-col"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
