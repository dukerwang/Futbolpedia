<style>
  :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  }

  body {
      transition: background-color 0.3s ease, color 0.3s ease;
  }

  /* Button press feedback for New Chat triggers */
  .btn-new-chat {
      transition:
          transform 150ms var(--ease-out),
          background-color 150ms ease,
          color 150ms ease,
          border-color 150ms ease,
          box-shadow 150ms ease;
  }
  .btn-new-chat:active {
      transform: scale(0.96);
  }
  @media (hover: hover) and (pointer: fine) {
      .btn-new-chat:hover .btn-new-chat-icon {
          transform: scale(1.06);
      }
  }
  .btn-new-chat-icon {
      transition: transform 150ms var(--ease-out);
  }

  /* New Chat empty stage & staggered children */
  .new-chat-stage {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition:
          opacity 220ms var(--ease-out),
          transform 220ms var(--ease-out);
      transition-behavior: allow-discrete;
  }
  .new-chat-crest {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition:
          opacity 200ms var(--ease-out),
          transform 200ms var(--ease-out);
      transition-behavior: allow-discrete;
  }
  .new-chat-caption {
      opacity: 1;
      transform: translateY(0);
      transition:
          opacity 220ms var(--ease-out) 40ms,
          transform 220ms var(--ease-out) 40ms;
      transition-behavior: allow-discrete;
  }

  /* Newly created conversation row in Saved Briefs */
  .conversation-row {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition:
          opacity 220ms var(--ease-out),
          transform 220ms var(--ease-out),
          background-color 200ms ease,
          border-color 200ms ease,
          box-shadow 200ms ease;
      transition-behavior: allow-discrete;
  }

  @starting-style {
      .new-chat-stage {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
      }
      .new-chat-crest {
          opacity: 0;
          transform: translateY(4px) scale(0.95);
      }
      .new-chat-caption {
          opacity: 0;
          transform: translateY(6px);
      }
      .conversation-row {
          opacity: 0;
          transform: translateY(-6px) scale(0.98);
      }
  }

  @supports not (transition-behavior: allow-discrete) {
      @keyframes newChatStageEnter {
          from {
              opacity: 0;
              transform: translateY(8px) scale(0.98);
          }
          to {
              opacity: 1;
              transform: translateY(0) scale(1);
          }
      }
      @keyframes convRowEnter {
          from {
              opacity: 0;
              transform: translateY(-6px) scale(0.98);
          }
          to {
              opacity: 1;
              transform: translateY(0) scale(1);
          }
      }
      .new-chat-stage {
          animation: newChatStageEnter 220ms var(--ease-out) both;
      }
      .conversation-row {
          animation: convRowEnter 220ms var(--ease-out) both;
      }
  }

  @media (prefers-reduced-motion: reduce) {
      .btn-new-chat,
      .btn-new-chat-icon {
          transition-duration: 100ms;
      }
      .btn-new-chat:active,
      .btn-new-chat:hover .btn-new-chat-icon {
          transform: none;
      }
      .new-chat-stage,
      .new-chat-crest,
      .new-chat-caption,
      .conversation-row {
          transform: none;
          transition-duration: 120ms;
          transition-delay: 0ms;
          animation: none;
      }
      @starting-style {
          .new-chat-stage,
          .new-chat-crest,
          .new-chat-caption,
          .conversation-row {
              transform: none;
          }
      }
  }

  ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
  }
  ::-webkit-scrollbar-track {
      background: transparent; 
  }
  ::-webkit-scrollbar-thumb {
      background: #D6D3CA; 
      border-radius: 3px;
  }
  .dark ::-webkit-scrollbar-thumb {
      background: #3E4559;
  }
  
  /* Markdown Styles specific to Editorial Theme */
  .prose p { margin-bottom: 1.25em; line-height: 1.75; font-weight: 300; }
  .prose strong { font-family: 'Playfair Display', serif; font-weight: 700; }
  .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
  .prose h3 { font-family: 'Playfair Display', serif; font-size: 1.25em; font-weight: 700; margin-top: 1.5em; margin-bottom: 0.5em; font-style: italic;}

  /* In-chat markdown */
  .chat-prose { line-height: 1.75; overflow-wrap: anywhere; }
  .chat-prose > :first-child { margin-top: 0; }
  .chat-prose > :last-child { margin-bottom: 0; }
  .chat-prose h1, .chat-prose h2 { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.35em; margin: 1.5em 0 0.5em; }
  .chat-prose h4 { font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.75em; margin: 1.25em 0 0.5em; opacity: 0.7; }
  .chat-prose ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
  .chat-prose li { margin-bottom: 0.35em; }
  .chat-prose li::marker { color: #10B981; }
  .chat-prose a { color: #059669; text-decoration: underline; text-underline-offset: 2px; }
  .dark .chat-prose a { color: #34D399; }
  .chat-prose blockquote { border-left: 2px solid #10B981; padding: 0.25em 0 0.25em 1em; margin: 1em 0; font-family: 'Playfair Display', serif; font-style: italic; opacity: 0.9; }
  .chat-prose code { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; padding: 0.1em 0.35em; background: rgba(26,31,46,0.06); }
  .dark .chat-prose code { background: rgba(214,211,202,0.1); }
  .chat-prose hr { border: 0; border-top: 1px solid #D6D3CA; margin: 1.5em 0; }
  .dark .chat-prose hr { border-color: #3E4559; }
  .chat-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 1em 0 1.25em; border: 1px solid #D6D3CA; }
  .dark .chat-table-wrap { border-color: #3E4559; }
  .chat-table-wrap table { width: 100%; border-collapse: collapse; font-size: 0.875em; line-height: 1.45; }
  .chat-table-wrap th { font-size: 0.7em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; text-align: left; white-space: nowrap; background: rgba(26,31,46,0.04); }
  .dark .chat-table-wrap th { background: rgba(214,211,202,0.06); }
  .chat-table-wrap th, .chat-table-wrap td { padding: 0.5rem 0.75rem; border-bottom: 1px solid rgba(26,31,46,0.08); }
  .dark .chat-table-wrap th, .dark .chat-table-wrap td { border-color: rgba(214,211,202,0.1); }
  .chat-table-wrap th, .chat-table-wrap td { overflow-wrap: normal; word-break: normal; }
  .chat-table-wrap td { font-variant-numeric: tabular-nums; min-width: 6rem; }
  .chat-table-wrap td:first-child { min-width: 8.5rem; }
  .chat-table-wrap tr:last-child td { border-bottom: 0; }
  .chat-prose.is-typing > :last-child::after { content: ''; display: inline-block; width: 0.45em; height: 1em; margin-left: 2px; vertical-align: -0.15em; background: currentColor; opacity: 0.5; animation: caret-blink 1s steps(2) infinite; }
  @keyframes caret-blink { to { visibility: hidden; } }

  /* Touch ergonomics */
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  button, [role="switch"] { touch-action: manipulation; }
</style>
