<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="ballGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Background Circle with Gradient -->
  <circle cx="64" cy="64" r="60" fill="url(#ballGrad)" />
  <!-- Gold Outer Border/Ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="4 2" opacity="0.8" />
  
  <!-- Classic pentagon/hexagon soccer panels drawn with precision -->
  <!-- Center Pentagon -->
  <polygon points="64,44 80,56 74,76 54,76 48,56" fill="url(#goldGrad)" />
  
  <!-- Lines extending outwards from center pentagon -->
  <line x1="64" y1="44" x2="64" y2="18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <line x1="80" y1="56" x2="102" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <line x1="74" y1="76" x2="88" y2="98" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <line x1="54" y1="76" x2="40" y2="98" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <line x1="48" y1="56" x2="26" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Outer Pentagon segments/lines for soccer pattern -->
  <path d="M 64,18 L 40,30 L 26,48 M 64,18 L 88,30 L 102,48 M 102,48 L 108,74 L 88,98 M 88,98 L 64,110 L 40,98 M 40,98 L 20,74 L 26,48" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  
  <!-- Sleek analytical/digital accents -->
  <circle cx="64" cy="18" r="4" fill="#ffffff" />
  <circle cx="102" cy="48" r="4" fill="#ffffff" />
  <circle cx="88" cy="98" r="4" fill="#ffffff" />
  <circle cx="40" cy="98" r="4" fill="#ffffff" />
  <circle cx="26" cy="48" r="4" fill="#ffffff" />
</svg>
